name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GitHub-hosted CPUs are not the 3900X. Committed .cargo/config.toml uses
# target-cpu=native (local box only). CI replaces that file before rust-cache
# so a partial cache restore cannot run a SIGILL binary.
env:
  RUSTFLAGS: "-C target-cpu=x86-64-v2"

jobs:
  test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: portable ISA (not 3900X native)
        run: |
          mkdir -p .cargo
          printf '%s\n' \
            '[build]' \
            'rustflags = ["-C", "target-cpu=x86-64-v2"]' \
            '[target.x86_64-unknown-linux-gnu]' \
            'rustflags = ["-C", "target-cpu=x86-64-v2"]' \
            > .cargo/config.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --workspace

  headless:
    name: headless engine-proof (tiny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: portable ISA (not 3900X native)
        run: |
          mkdir -p .cargo
          printf '%s\n' \
            '[build]' \
            'rustflags = ["-C", "target-cpu=x86-64-v2"]' \
            '[target.x86_64-unknown-linux-gnu]' \
            'rustflags = ["-C", "target-cpu=x86-64-v2"]' \
            > .cargo/config.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: mesa vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-tools
      - name: tiny cosmos engine-proof
        run: |
          set -o pipefail
          if ! vulkaninfo --summary >/dev/null 2>&1; then
            echo "no Vulkan adapter; skipping GPU smoke (not a test failure)"
            exit 0
          fi
          out=$(cargo run -p qga-app --release -- \
            --headless --frames 8 --scene cosmos --profile tiny 2>&1 | tee /dev/stderr) || {
            echo "$out" | grep -qi 'no Vulkan adapter' && {
              echo "wgpu found no adapter; skipping GPU smoke"
              exit 0
            }
            exit 1
          }
          echo "$out" | grep -q 'engine-proof scene=cosmos' \
            && echo "$out" | grep -q 'record_bytes=32' \
            && echo "$out" | grep -q 'workgroup=256' \
            && echo "$out" | grep -q 'profile=tiny' \
            || {
              echo "headless ran but did not print engine-proof (tiny cosmos)"
              exit 1
            }
